<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Cerezas de Identidad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700&family=Nunito:wght@400;700;800&display=swap">
<style>
  /* Una sola estética de juego (ciruela + crema + cereza), sin modo claro/oscuro: lienzo centrado y modales tipo "calcomanía" */
  :root {
    --plum: #2a1b2e;
    --plum-2: #4a3150;
    --cream: #fff4e0;
    --paper: #fffdf8;
    --cherry: #d7263d;
    --cherry-d: #b81d31;
    --mustard: #f2b134;
    --f-display: "Grandstander", "Trebuchet MS", sans-serif;
    --f-body: "Nunito", "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    box-sizing: border-box;
    background: var(--plum);
    color: var(--cream);
    font-family: var(--f-body);
    overflow: hidden;
    padding-block: 8px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #game { width: 100%; height: 100%; }
  #game canvas { border-radius: 14px; touch-action: none; }

  .overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
             max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: rgb(42 27 46 / 0.72);
  }
  .card {
    box-sizing: border-box;
    width: 100%; max-width: 520px; max-height: 100%; overflow: auto;
    background: var(--cream); color: var(--plum);
    border: 3px solid var(--plum); border-radius: 20px;
    box-shadow: 8px 8px 0 var(--cherry);
    padding: 26px 28px 24px;
    display: flex; flex-direction: column; gap: 12px;
    animation: pop .28s cubic-bezier(.2, 1.4, .4, 1);
  }
  .card h2 { font-family: var(--f-display); font-size: 30px; line-height: 1.12; margin: 0; text-wrap: balance; }
  .card p { margin: 0; font-size: 17px; line-height: 1.5; max-width: 62ch; }
  .eyebrow {
    display: flex; align-items: center; gap: 8px;
    font-weight: 800; font-size: 13px !important; letter-spacing: .08em; text-transform: uppercase;
    color: var(--cherry);
  }
  .think { border: 2px dashed var(--plum-2); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .think span { font-family: var(--f-display); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--plum-2); }
  .think p { font-weight: 700; }
  .recap { margin: 0; padding-left: 24px; display: grid; gap: 3px; font-size: 16px; font-weight: 700; }
  label { font-weight: 800; font-size: 14px; letter-spacing: .04em; }
  input {
    font: 700 18px var(--f-body); color: var(--plum); background: var(--paper);
    border: 2px solid var(--plum); border-radius: 12px; padding: 12px 14px; margin-top: -6px;
  }
  input:focus-visible { outline: 3px solid var(--mustard); outline-offset: 2px; }
  #card-btn {
    align-self: flex-start; margin-top: 4px;
    font-family: var(--f-display); font-weight: 700; font-size: 19px;
    background: var(--cherry); color: var(--cream);
    border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer;
    box-shadow: 0 4px 0 var(--plum);
  }
  #card-btn:hover { background: var(--cherry-d); }
  #card-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--plum); }
  #card-btn:focus-visible { outline: 3px solid var(--mustard); outline-offset: 3px; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  @media (max-width: 480px) {
    .card { padding: 20px 18px; }
    .card h2 { font-size: 24px; }
    .card p { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>
</head>
<body>

<div id="game"></div>
<div id="overlay" class="overlay" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="game.js"></script>
</body>
</html>
